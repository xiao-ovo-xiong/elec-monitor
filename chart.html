<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2f4f7">
    <title>宿舍剩余电量</title>
    <style>
        /* ===== 基础重置 & 全局 ===== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            background: #f2f4f7;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 0 env(safe-area-inset-bottom) 0;
        }

        /* ===== 顶部摘要卡片 ===== */
        #summary {
            position: relative;
            overflow: hidden;
            background: #ffffff;
            margin: 12px 12px 10px;
            padding: 20px 22px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.25s;
        }
        #summary::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, #2563eb, #60a5fa, #93bbfc);
            border-radius: 20px 20px 0 0;
        }

        /* 电量数值区 */
        .power-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .power-head .label {
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            letter-spacing: 0.5px;
        }
        .power-head .value-wrap {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .power-head .val {
            font-size: clamp(38px, 11vw, 54px);
            font-weight: 700;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            color: #1f2937;
            transition: color 0.15s;
        }
        .power-head .val.flash {
            animation: flash 0.9s ease;
        }
        @keyframes flash {
            0% {
                color: #2563eb;
            }
            40% {
                color: #1d4ed8;
            }
            100% {
                color: #1f2937;
            }
        }
        .power-head .unit {
            font-size: 16px;
            font-weight: 500;
            color: #9ca3af;
            margin-left: 2px;
        }

        /* 元信息行 */
        #meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            font-size: 13px;
            color: #9ca3af;
            margin-top: 2px;
        }
        #meta .count {
            font-weight: 600;
            color: #4b5563;
        }
        #meta .dot-divider {
            color: #d1d5db;
        }

        /* 状态指示器 (独立一行) */
        #status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: #8b95a5;
            padding: 4px 0 2px;
            border-top: 1px solid #f0f2f5;
            padding-top: 12px;
        }
        #status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #93c5fd;
            flex: none;
            transition: background 0.3s, transform 0.3s;
        }
        #status.loading .dot {
            background: transparent;
            border: 2.5px solid #dbe4f7;
            border-top-color: #2563eb;
            animation: rot 0.9s linear infinite;
        }
        #status.updated .dot {
            background: #22c55e;
            animation: pop 0.45s ease;
        }
        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pop {
            0% {
                transform: scale(0.4);
            }
            60% {
                transform: scale(1.25);
            }
            100% {
                transform: scale(1);
            }
        }
        #status .sttxt {
            font-weight: 450;
        }
        #status.updated .sttxt {
            color: #16a34a;
        }

        /* 范围切换按钮组 — 分段控制器风格 */
        #ranges {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            background: #f1f4f9;
            border-radius: 999px;
            padding: 4px;
        }
        #ranges button {
            flex: 1;
            border: none;
            background: transparent;
            border-radius: 999px;
            padding: 7px 0 6px;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        #ranges button.on {
            background: #ffffff;
            color: #1f2937;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.13), 0 1px 3px rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }
        #ranges button:active {
            transform: scale(0.95);
        }

        /* ===== 图表容器 ===== */
        #chart {
            flex: 1;
            min-height: 220px;
            background: #ffffff;
            margin: 0 12px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            position: relative;
        }
        #cv {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ===== 底部脚标 ===== */
        #foot {
            padding: 4px 16px 12px;
            font-size: 11px;
            color: #b6bec9;
            text-align: center;
            line-height: 1.7;
            letter-spacing: 0.2px;
        }
        #foot .highlight {
            color: #9aa3b5;
        }

        /* ===== 工具类 ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ===== 暗色 / 夜间模式适配 (可选) ===== */
        @media (prefers-color-scheme: dark) {
            html,
            body {
                background: #111318;
                color: #e5e7eb;
            }
            #summary,
            #chart {
                background: #1c1f26;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            }
            #summary::before {
                background: linear-gradient(90deg, #3b82f6, #60a5fa, #93bbfc);
            }
            .power-head .label {
                color: #9ca3af;
            }
            .power-head .val {
                color: #f0f2f5;
            }
            @keyframes flash {
                0% {
                    color: #3b82f6;
                }
                40% {
                    color: #60a5fa;
                }
                100% {
                    color: #f0f2f5;
                }
            }
            #meta {
                color: #6b7280;
            }
            #meta .count {
                color: #b0b8c5;
            }
            #meta .dot-divider {
                color: #374151;
            }
            #status {
                border-top-color: #2a2f3a;
                color: #7a8496;
            }
            #status.updated .sttxt {
                color: #4ade80;
            }
            #status.updated .dot {
                background: #4ade80;
            }
            #ranges {
                background: #2a2f3a;
            }
            #ranges button {
                color: #9ca3af;
            }
            #ranges button.on {
                background: #374151;
                color: #f0f2f5;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }
            #foot {
                color: #4b5563;
            }
            #foot .highlight {
                color: #6b7280;
            }
            /* Canvas 内文字颜色由 JS 控制，此处仅作示意 */
        }

        /* ===== 小屏微调 ===== */
        @media (max-width: 420px) {
            #summary {
                padding: 16px 16px 14px;
                margin: 8px 10px 8px;
            }
            .power-head .val {
                font-size: clamp(32px, 9vw, 42px);
            }
            #ranges button {
                font-size: 12px;
                padding: 6px 0;
            }
            #meta {
                font-size: 12px;
                gap: 4px 10px;
            }
            #status {
                font-size: 12px;
                margin-top: 10px;
                padding-top: 10px;
            }
            #chart {
                min-height: 180px;
                margin: 0 10px 8px;
                border-radius: 16px;
            }
            #foot {
                font-size: 10px;
                padding: 2px 12px 10px;
            }
        }
        @media (max-width: 360px) {
            #summary {
                padding: 12px 12px 12px;
                margin: 6px 8px 6px;
                border-radius: 16px;
            }
            .power-head .val {
                font-size: clamp(28px, 7.5vw, 34px);
            }
            #ranges {
                gap: 4px;
                padding: 3px;
            }
            #ranges button {
                font-size: 11px;
                padding: 5px 0;
            }
            #chart {
                min-height: 150px;
                margin: 0 8px 6px;
                border-radius: 14px;
            }
        }

        /* 横屏提示 (可选) */
        @media (orientation: landscape) and (max-height: 500px) {
            #summary {
                padding: 12px 16px 10px;
                margin: 6px 12px 6px;
            }
            .power-head .val {
                font-size: clamp(28px, 7vw, 38px);
            }
            #chart {
                min-height: 140px;
            }
            #ranges {
                margin-top: 8px;
            }
            #status {
                margin-top: 6px;
                padding-top: 6px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="summary">
            <!-- 电量主信息 -->
            <div class="power-head">
                <span class="label">⚡ 当前剩余电量</span>
                <span class="value-wrap">
                    <span class="val" id="val">--</span>
                    <span class="unit">度</span>
                </span>
            </div>
            <!-- 元信息 -->
            <div id="meta">
                <span>共 <span class="count" id="recCount">0</span> 条记录</span>
                <span class="dot-divider">·</span>
                <span>更新于 <span id="updateTime">--</span></span>
            </div>
            <!-- 状态 + 范围切换 -->
            <div id="status">
                <span class="dot"></span>
                <span class="sttxt" id="sttxt">自动更新中</span>
            </div>
            <div id="ranges" role="tablist">
                <button data-r="all" class="on" role="tab">全部</button>
                <button data-r="7" role="tab">近7天</button>
                <button data-r="30" role="tab">近30天</button>
            </div>
        </div>

        <div id="chart">
            <canvas id="cv"></canvas>
        </div>

        <div id="foot">
            <span class="highlight">数据来自南昌工学院智能收费系统（4栋/2层/4-267）</span><br>
            约 10 分钟采集一次 · 自动更新，有变化时数字与曲线会动起来
        </div>
    </div>

    <script>
        // ============================================================
        //  数据
        // ============================================================
        var RAW = [["2026-08-22T10:27:32+00:00", 82.95, 0.0, 82.95], ["2026-08-22T10:56:36+00:00", 82.79, 0.0, 82.79], ["2026-08-22T11:25:10+00:00", 82.75, 0.0, 82.75], ["2026-08-22T11:46:08+00:00", 82.72, 0.0, 82.72], ["2026-08-22T12:01:23+00:00", 82.52, 0.0, 82.52], ["2026-08-22T12:58:00+00:00", 81.53, 0.0, 81.53], ["2026-08-22T13:38:09+00:00", 81.11, 0.0, 81.11], ["2026-08-22T13:57:51+00:00", 80.87, 0.0, 80.87], ["2026-08-22T14:29:23+00:00", 80.54, 0.0, 80.54]];

        // ============================================================
        //  工具函数
        // ============================================================
        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function fmtDT(ts) {
            return pad(ts.getMonth() + 1) + '-' + pad(ts.getDate()) + ' ' +
                pad(ts.getHours()) + ':' + pad(ts.getMinutes());
        }

        function fmtShort(ts) {
            var now = new Date();
            var diff = (now - ts) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return fmtDT(ts);
        }

        // ============================================================
        //  顶部卡片渲染
        // ============================================================
        var prevTotal = null;
        var numAnim = null;
        var valEl = document.getElementById('val');
        var recCountEl = document.getElementById('recCount');
        var updateTimeEl = document.getElementById('updateTime');
        var stEl = document.getElementById('status');
        var stTxt = document.getElementById('sttxt');

        function renderCard(roll) {
            var last = RAW.length ? RAW[RAW.length - 1] : null;
            var total = last ? Number(last[3]) : null;
            var target = (total === null || isNaN(total)) ? null : total;

            // 数字动画
            if (roll && target !== null && prevTotal !== null && isFinite(prevTotal) && prevTotal !== target) {
                if (numAnim) cancelAnimationFrame(numAnim);
                var from = prevTotal,
                    to = target,
                    t0 = performance.now();

                function step(now) {
                    var k = Math.min(1, (now - t0) / 520);
                    var e = 1 - Math.pow(1 - k, 3);
                    valEl.textContent = (from + (to - from) * e).toFixed(2);
                    if (k < 1) {
                        numAnim = requestAnimationFrame(step);
                    } else {
                        valEl.textContent = to.toFixed(2);
                        valEl.classList.remove('flash');
                        void valEl.offsetWidth;
                        valEl.classList.add('flash');
                    }
                }
                numAnim = requestAnimationFrame(step);
            } else {
                valEl.textContent = (target === null) ? '--' : target.toFixed(2);
            }
            prevTotal = target;

            // 元信息
            var ts = last ? new Date(last[0]) : null;
            recCountEl.textContent = RAW.length;
            updateTimeEl.textContent = ts ? fmtShort(ts) : '--';
            updateTimeEl.title = ts ? fmtDT(ts) : '';
        }

        function setStatus(mode) {
            stEl.className = mode;
            if (mode === 'loading') {
                stTxt.textContent = '正在更新…';
            } else if (mode === 'updated') {
                stTxt.textContent = '刚刚更新 ✓';
            } else {
                stTxt.textContent = '自动更新中';
            }
        }

        // ============================================================
        //  Canvas 折线图
        // ============================================================
        var canvas = document.getElementById('cv');
        var ctx = canvas.getContext('2d');
        var RANGE = 'all';
        var animT = null;

        function traceLine(px, py, n) {
            ctx.moveTo(px[0], py[0]);
            if (n === 1) return;
            if (n === 2) { ctx.lineTo(px[1], py[1]); return; }
            for (var i = 0; i < n - 1; i++) {
                var p0x = px[Math.max(i - 1, 0)],
                    p0y = py[Math.max(i - 1, 0)];
                var p1x = px[i],
                    p1y = py[i];
                var p2x = px[i + 1],
                    p2y = py[i + 1];
                var p3x = px[Math.min(i + 2, n - 1)],
                    p3y = py[Math.min(i + 2, n - 1)];
                ctx.bezierCurveTo(
                    p1x + (p2x - p0x) / 6, p1y + (p2y - p0y) / 6,
                    p2x - (p3x - p1x) / 6, p2y - (p3y - p1y) / 6,
                    p2x, p2y
                );
            }
        }

        function draw(pg) {
            var dpr = window.devicePixelRatio || 1;
            var w = canvas.clientWidth,
                h = canvas.clientHeight;
            if (!w || !h) { canvas.width = canvas.height = 0; return; }
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            // 准备数据
            var pts = [];
            for (var i = 0; i < RAW.length; i++) {
                var v = Number(RAW[i][3]);
                if (isNaN(v)) continue;
                pts.push({ t: new Date(RAW[i][0]), v: v });
            }
            if (RANGE !== 'all' && pts.length) {
                var end = pts[pts.length - 1].t.getTime();
                var start = end - parseInt(RANGE, 10) * 86400000;
                pts = pts.filter(function(p) { return p.t.getTime() >= start; });
            }
            if (!pts.length) {
                ctx.fillStyle = '#9ca3af';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('暂无数据', w / 2, h / 2);
                return;
            }

            var padL = 48,
                padR = 16,
                padT = 14,
                padB = 30;
            var pw = w - padL - padR,
                ph = h - padT - padB;

            // Y 轴范围
            var mn = Infinity,
                mx = -Infinity;
            for (var j = 0; j < pts.length; j++) {
                if (pts[j].v < mn) mn = pts[j].v;
                if (pts[j].v > mx) mx = pts[j].v;
            }
            var lo = Math.floor((mn - 0.5) * 10) / 10;
            var hi = Math.ceil((mx + 0.5) * 10) / 10;
            if (hi - lo < 1) { hi = lo + 1; }

            var t0 = pts[0].t.getTime(),
                t1 = pts[pts.length - 1].t.getTime();
            var span = (t1 - t0) || 1;

            function X(t) { return padL + (t.getTime() - t0) / span * pw; }

            function Y(v) { return padT + (hi - v) / (hi - lo) * ph; }

            var px = [],
                py = [];
            for (var a = 0; a < pts.length; a++) {
                px.push(X(pts[a].t));
                py.push(Y(pts[a].v));
            }

            // ---- 网格 + Y轴 ----
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var gridColor = isDark ? '#2a2f3a' : '#f0f2f5';
            var labelColor = isDark ? '#6b7280' : '#9ca3af';
            var lineColor = isDark ? '#3b82f6' : '#2563eb';
            var lineColorRgba = isDark ? 'rgba(59,130,246,' : 'rgba(37,99,235,';
            var textColor = isDark ? '#d1d5db' : '#1f2937';

            ctx.font = '10px sans-serif';
            ctx.textBaseline = 'middle';
            var steps = 4;
            for (var s = 0; s <= steps; s++) {
                var vv = lo + (hi - lo) * s / steps;
                var yy = Y(vv);
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(padL, yy);
                ctx.lineTo(padL + pw, yy);
                ctx.stroke();
                ctx.fillStyle = labelColor;
                ctx.textAlign = 'right';
                ctx.fillText(vv.toFixed(1), padL - 6, yy);
            }

            // ---- X轴时间 ----
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = labelColor;
            ctx.font = '10px sans-serif';
            ctx.fillText(fmtDT(pts[0].t), padL, padT + ph + 8);
            ctx.fillText(fmtDT(pts[pts.length - 1].t), padL + pw, padT + ph + 8);
            if (span > 36 * 3600000) {
                var mid = new Date((t0 + t1) / 2);
                ctx.fillText(
                    pad(mid.getMonth() + 1) + '-' + pad(mid.getDate()) + ' ' +
                    pad(mid.getHours()) + ':00',
                    padL + pw / 2, padT + ph + 8
                );
            }

            var pDone = (pg === undefined || pg === null) ? 1 : pg;

            // ---- 裁剪（动画用） ----
            if (pDone < 1) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(padL, padT - 3, Math.max(1, pw * pDone) + 3, ph + 8);
                ctx.clip();
            }

            // ---- 面积渐变 ----
            ctx.beginPath();
            ctx.moveTo(px[0], py[0]);
            traceLine(px, py, pts.length);
            ctx.lineTo(px[px.length - 1], padT + ph);
            ctx.lineTo(px[0], padT + ph);
            ctx.closePath();
            var g = ctx.createLinearGradient(0, padT, 0, padT + ph);
            g.addColorStop(0, lineColorRgba + '0.22)');
            g.addColorStop(1, lineColorRgba + '0)');
            ctx.fillStyle = g;
            ctx.fill();

            // ---- 折线 ----
            ctx.beginPath();
            traceLine(px, py, pts.length);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2.4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            if (pDone < 1) ctx.restore();

            // ---- 末点高亮 + 数值 ----
            if (pDone >= 0.999) {
                var lp = pts[pts.length - 1];
                var lx = px[px.length - 1],
                    ly = py[py.length - 1];
                // 外发光
                var glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 16);
                glow.addColorStop(0, lineColorRgba + '0.25)');
                glow.addColorStop(1, lineColorRgba + '0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(lx, ly, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(lx, ly, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 2.8;
                ctx.strokeStyle = lineColor;
                ctx.stroke();

                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = textColor;
                var label = lp.v.toFixed(1) + ' 度';
                var tx = Math.min(lx + 10, padL + pw - 70);
                ctx.fillText(label, tx, ly - 6);
            }
        }

        // ============================================================
        //  动画辅助
        // ============================================================
        function animate(pgFrom, ms, done) {
            if (animT) cancelAnimationFrame(animT);
            var t0 = performance.now(),
                len = Math.max(1, ms);

            function step(now) {
                var k = Math.min(1, (now - t0) / len);
                var e = 1 - Math.pow(1 - k, 3);
                draw(pgFrom + (1 - pgFrom) * e);
                if (k < 1) {
                    animT = requestAnimationFrame(step);
                } else {
                    animT = null;
                    if (done) done();
                }
            }
            animT = requestAnimationFrame(step);
        }

        // ============================================================
        //  范围切换
        // ============================================================
        var btns = document.querySelectorAll('#ranges button');
        for (var b = 0; b < btns.length; b++) {
            btns[b].addEventListener('click', function() {
                RANGE = this.getAttribute('data-r');
                for (var q = 0; q < btns.length; q++) btns[q].className = '';
                this.className = 'on';
                animate(0, 400);
            });
        }

        // ============================================================
        //  数据刷新
        // ============================================================
        var useFetch = location.protocol !== 'file:';

        function refresh() {
            if (!useFetch) { location.reload(); return; }
            setStatus('loading');
            fetch('monitor_data.csv', { cache: 'no-store' })
                .then(function(r) {
                    if (!r.ok) throw new Error('http ' + r.status);
                    return r.text();
                })
                .then(function(txt) {
                    var rows = [];
                    var lines = txt.split(/\r?\n/);
                    for (var i = 0; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        var p = lines[i].split(',');
                        if (p.length >= 4 && p[0] !== 'time') {
                            var v1 = Number(p[1]),
                                v3 = Number(p[3]);
                            if (!isNaN(v1) && !isNaN(v3)) rows.push([p[0], v1, Number(p[2]), v3]);
                        }
                    }
                    if (rows.length && rows.length !== RAW.length) {
                        RAW = rows;
                        renderCard(true);
                        setStatus('updated');
                        animate(0, 680);
                        setTimeout(function() { setStatus('idle'); }, 3200);
                    } else if (rows.length) {
                        setStatus('idle');
                    } else {
                        setStatus('idle');
                    }
                })
                .catch(function() {
                    location.reload();
                });
        }

        if (useFetch) {
            setInterval(refresh, 5 * 60 * 1000);
            setTimeout(refresh, 2500);
        } else {
            setTimeout(function() { location.reload(); }, 5 * 60 * 1000);
        }

        // ============================================================
        //  启动
        // ============================================================
        renderCard();
        setStatus('idle');

        function redraw() {
            if (animT) { cancelAnimationFrame(animT);
                animT = null; }
            draw(1);
        }

        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(redraw, 120);
        });
        window.addEventListener('orientationchange', function() {
            setTimeout(redraw, 350);
        });

        // 暗色模式切换时重绘
        var darkMatch = window.matchMedia('(prefers-color-scheme: dark)');
        darkMatch.addEventListener('change', redraw);

        animate(0, 720);
    </script>
</body>
</html>
