<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2f4f7">
    <title>宿舍剩余电量</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            background: #f2f4f7;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 0 env(safe-area-inset-bottom) 0;
        }
        /* ===== 顶部摘要卡片 ===== */
        #summary {
            position: relative;
            overflow: hidden;
            background: #ffffff;
            margin: 12px 12px 10px;
            padding: 18px 20px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.03);
        }
        #summary::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, #2563eb, #10b981, #93bbfc);
            border-radius: 20px 20px 0 0;
        }
        #summary .head {
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        /* 双房间数值块 */
        #rooms {
            display: flex;
            gap: 10px;
        }
        #rooms .room {
            flex: 1;
            min-width: 0;
            background: #f7f9fc;
            border-radius: 14px;
            padding: 10px 12px 12px;
        }
        #rooms .room .rlabel {
            font-size: 12px;
            font-weight: 600;
            color: #8b95a5;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #rooms .room .row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-top: 3px;
        }
        #rooms .room .val {
            font-size: clamp(28px, 8.5vw, 42px);
            font-weight: 700;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        #rooms .room.v1 .val {
            color: #2563eb;
        }
        #rooms .room.v2 .val {
            color: #10b981;
        }
        #rooms .room .unit {
            font-size: 13px;
            color: #9ca3af;
        }
        #rooms .room .val.flash {
            animation: flash 0.9s ease;
        }
        @keyframes flash {
            0% {
                opacity: 0.55;
            }
            40% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }
        /* 元信息行 */
        #meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            font-size: 13px;
            color: #9ca3af;
            margin-top: 12px;
        }
        #meta .count {
            font-weight: 600;
            color: #4b5563;
        }
        #meta .dot-divider {
            color: #d1d5db;
        }
        /* 状态指示器 */
        #status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #8b95a5;
            border-top: 1px solid #f0f2f5;
            padding-top: 10px;
        }
        #status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #93c5fd;
            flex: none;
            transition: background 0.3s, transform 0.3s;
        }
        #status.loading .dot {
            background: transparent;
            border: 2.5px solid #dbe4f7;
            border-top-color: #2563eb;
            animation: rot 0.9s linear infinite;
        }
        #status.updated .dot {
            background: #22c55e;
            animation: pop 0.45s ease;
        }
        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pop {
            0% {
                transform: scale(0.4);
            }
            60% {
                transform: scale(1.25);
            }
            100% {
                transform: scale(1);
            }
        }
        #status.updated .sttxt {
            color: #16a34a;
        }
        /* 范围切换按钮 */
        #ranges {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            background: #f1f4f9;
            border-radius: 999px;
            padding: 4px;
        }
        #ranges button {
            flex: 1;
            border: none;
            background: transparent;
            border-radius: 999px;
            padding: 7px 0 6px;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        #ranges button.on {
            background: #ffffff;
            color: #1f2937;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.13), 0 1px 3px rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }
        #ranges button:active {
            transform: scale(0.95);
        }
        /* ===== 图表容器 ===== */
        #chart {
            flex: 1;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            margin: 0 12px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }
        #legend {
            display: flex;
            gap: 18px;
            padding: 12px 16px 0;
            font-size: 12px;
            color: #8b95a5;
        }
        #legend .li {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #legend .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex: none;
        }
        #legend .dot.c1 {
            background: #2563eb;
        }
        #legend .dot.c2 {
            background: #10b981;
        }
        #cv {
            flex: 1;
            display: block;
            width: 100%;
        }
        /* 底部 */
        #foot {
            padding: 4px 16px 12px;
            font-size: 11px;
            color: #b6bec9;
            text-align: center;
            line-height: 1.7;
        }
        /* ===== 深色模式 ===== */
        @media (prefers-color-scheme: dark) {
            html,
            body {
                background: #111318;
                color: #e5e7eb;
            }
            #summary,
            #chart {
                background: #1c1f26;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            }
            #summary .head {
                color: #9ca3af;
            }
            #rooms .room {
                background: #242832;
            }
            #rooms .room.v1 .val {
                color: #3b82f6;
            }
            #rooms .room.v2 .val {
                color: #34d399;
            }
            #meta {
                color: #6b7280;
            }
            #meta .count {
                color: #b0b8c5;
            }
            #status {
                border-top-color: #2a2f3a;
                color: #7a8496;
            }
            #status.updated .sttxt {
                color: #4ade80;
            }
            #status.updated .dot {
                background: #4ade80;
            }
            #ranges {
                background: #2a2f3a;
            }
            #ranges button {
                color: #9ca3af;
            }
            #ranges button.on {
                background: #374151;
                color: #f0f2f5;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }
            #legend .dot.c1 {
                background: #3b82f6;
            }
            #legend .dot.c2 {
                background: #34d399;
            }
            #foot {
                color: #4b5563;
            }
            @keyframes flash {
                0% {
                    opacity: 0.4;
                }
                40% {
                    opacity: 1;
                }
                100% {
                    opacity: 1;
                }
            }
        }
        /* ===== 小屏微调 ===== */
        @media (max-width: 420px) {
            #summary {
                padding: 14px 14px 12px;
                margin: 8px 10px 8px;
            }
            #rooms .room {
                padding: 8px 10px 10px;
            }
            #rooms .room .val {
                font-size: clamp(24px, 7vw, 34px);
            }
            #ranges button {
                font-size: 12px;
                padding: 6px 0;
            }
            #meta {
                font-size: 12px;
                gap: 4px 10px;
            }
            #chart {
                min-height: 190px;
                margin: 0 10px 8px;
                border-radius: 16px;
            }
            #foot {
                font-size: 10px;
            }
        }
        @media (max-width: 360px) {
            #rooms {
                gap: 6px;
            }
            #rooms .room {
                padding: 6px 8px 8px;
            }
            #rooms .room .val {
                font-size: clamp(20px, 6vw, 28px);
            }
            #chart {
                min-height: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="summary">
            <div class="head">⚡ 当前剩余电量</div>
            <div id="rooms">
                <div class="room v1">
                    <div class="rlabel">4-267</div>
                    <div class="row">
                        <span class="val" id="val1">--</span><span class="unit">度</span>
                    </div>
                </div>
                <div class="room v2">
                    <div class="rlabel">4-265</div>
                    <div class="row">
                        <span class="val" id="val2">--</span><span class="unit">度</span>
                    </div>
                </div>
            </div>
            <div id="meta">
                <span>共 <span class="count" id="recCount">0</span> 条记录</span>
                <span class="dot-divider">·</span>
                <span>更新于 <span id="updateTime">--</span></span>
            </div>
            <div id="status">
                <span class="dot"></span>
                <span class="sttxt" id="sttxt">自动更新中</span>
            </div>
            <div id="ranges">
                <button data-r="all" class="on">全部</button>
                <button data-r="7">近7天</button>
                <button data-r="30">近30天</button>
            </div>
        </div>

        <div id="chart">
            <div id="legend">
                <span class="li"><span class="dot c1"></span>4-267</span>
                <span class="li"><span class="dot c2"></span>4-265</span>
            </div>
            <canvas id="cv"></canvas>
        </div>

        <div id="foot">
            数据来自南昌工学院智能收费系统（4栋/2层/4-267 · 4栋/2层/4-265）<br>
            约 10 分钟采集一次 · 自动更新，有变化时数字与曲线会动起来
        </div>
    </div>

    <script>
        // ============================================================
        //  数据: [time, b1, s1, 合1, b2, s2, 合2]  (合2可能为 null)
        // ============================================================
        var RAW = [["2026-08-22T10:27:32+00:00", 82.95, 0.0, 82.95, null, null, null], ["2026-08-22T10:56:36+00:00", 82.79, 0.0, 82.79, null, null, null], ["2026-08-22T11:25:10+00:00", 82.75, 0.0, 82.75, null, null, null], ["2026-08-22T11:46:08+00:00", 82.72, 0.0, 82.72, null, null, null], ["2026-08-22T12:01:23+00:00", 82.52, 0.0, 82.52, null, null, null], ["2026-08-22T12:58:00+00:00", 81.53, 0.0, 81.53, null, null, null], ["2026-08-22T13:38:09+00:00", 81.11, 0.0, 81.11, null, null, null], ["2026-08-22T13:57:51+00:00", 80.87, 0.0, 80.87, null, null, null], ["2026-08-22T14:29:23+00:00", 80.54, 0.0, 80.54, null, null, null], ["2026-08-22T14:52:22+00:00", 80.4, 0.0, 80.4, null, null, null], ["2026-08-22T15:21:25+00:00", 80.21, 0.0, 80.21, null, null, null], ["2026-08-22T15:47:15+00:00", 80.05, 0.0, 80.05, null, null, null], ["2026-08-22T16:01:18+00:00", 79.97, 0.0, 79.97, null, null, null], ["2026-08-22T16:37:52+00:00", 79.95, 0.0, 79.95, null, null, null], ["2026-08-22T16:59:02+00:00", 79.23, 0.0, 79.23, null, null, null], ["2026-08-22T17:22:07+00:00", 78.74, 0.0, 78.74, 24.2, 0.0, 24.2], ["2026-08-22T17:50:30+00:00", 78.38, 0.0, 78.38, 23.69, 0.0, 23.69], ["2026-08-22T18:31:19+00:00", 78.13, 0.0, 78.13, 23.05, 0.0, 23.05], ["2026-08-22T19:01:58+00:00", 78.04, 0.0, 78.04, 22.6, 0.0, 22.6], ["2026-08-22T19:32:12+00:00", 77.95, 0.0, 77.95, 22.12, 0.0, 22.12], ["2026-08-22T19:53:34+00:00", 77.89, 0.0, 77.89, 21.82, 0.0, 21.82], ["2026-08-22T20:23:34+00:00", 77.8, 0.0, 77.8, 21.34, 0.0, 21.34], ["2026-08-22T20:49:29+00:00", 77.74, 0.0, 77.74, 20.98, 0.0, 20.98], ["2026-08-22T21:08:42+00:00", 77.68, 0.0, 77.68, 20.67, 0.0, 20.67], ["2026-08-22T21:34:52+00:00", 77.61, 0.0, 77.61, 20.28, 0.0, 20.28], ["2026-08-22T21:55:04+00:00", 77.56, 0.0, 77.56, 20.01, 0.0, 20.01], ["2026-08-22T22:22:34+00:00", 77.48, 0.0, 77.48, 19.58, 0.0, 19.58]];

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function fmtDT(ts) {
            return pad(ts.getMonth() + 1) + '-' + pad(ts.getDate()) + ' ' +
                pad(ts.getHours()) + ':' + pad(ts.getMinutes());
        }

        function fmtShort(ts) {
            var now = new Date();
            var diff = (now - ts) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return fmtDT(ts);
        }

        // ============================================================
        //  顶部卡片渲染 (双房间)
        // ============================================================
        var prev1 = null,
            prev2 = null,
            numAnim = null;
        var val1El = document.getElementById('val1');
        var val2El = document.getElementById('val2');
        var recCountEl = document.getElementById('recCount');
        var updateTimeEl = document.getElementById('updateTime');
        var stEl = document.getElementById('status');
        var stTxt = document.getElementById('sttxt');

        function rollValue(el, prev, now, done) {
            if (numAnim) cancelAnimationFrame(numAnim);
            if (prev !== null && isFinite(prev) && now !== null && isFinite(now) && prev !== now) {
                var from = prev,
                    to = now,
                    t0 = performance.now();

                function step(t) {
                    var k = Math.min(1, (t - t0) / 520);
                    var e = 1 - Math.pow(1 - k, 3);
                    el.textContent = (from + (to - from) * e).toFixed(2);
                    if (k < 1) {
                        numAnim = requestAnimationFrame(step);
                    } else {
                        el.textContent = to.toFixed(2);
                        if (done) done();
                    }
                }
                numAnim = requestAnimationFrame(step);
            } else {
                el.textContent = (now === null || !isFinite(now)) ? '--' : now.toFixed(2);
            }
        }

        function renderCard(roll) {
            var last = RAW.length ? RAW[RAW.length - 1] : null;
            var t1 = last ? Number(last[3]) : NaN;
            var t2 = (last && last[6] !== undefined && last[6] !== null) ? Number(last[6]) : NaN;
            if (isNaN(t1)) t1 = null;
            if (isNaN(t2)) t2 = null;
            if (roll) {
                var f1 = function() {
                    val1El.classList.remove('flash');
                    void val1El.offsetWidth;
                    val1El.classList.add('flash');
                };
                var f2 = function() {
                    val2El.classList.remove('flash');
                    void val2El.offsetWidth;
                    val2El.classList.add('flash');
                };
                rollValue(val1El, prev1, t1, f1);
                rollValue(val2El, prev2, t2, f2);
            } else {
                val1El.textContent = (t1 === null) ? '--' : t1.toFixed(2);
                val2El.textContent = (t2 === null) ? '--' : t2.toFixed(2);
            }
            prev1 = t1;
            prev2 = t2;
            var ts = last ? new Date(last[0]) : null;
            recCountEl.textContent = RAW.length;
            updateTimeEl.textContent = ts ? fmtShort(ts) : '--';
            updateTimeEl.title = ts ? fmtDT(ts) : '';
        }

        function setStatus(mode) {
            stEl.className = mode;
            if (mode === 'loading') stTxt.textContent = '正在更新…';
            else if (mode === 'updated') stTxt.textContent = '刚刚更新 ✓';
            else stTxt.textContent = '自动更新中';
        }

        // ============================================================
        //  Canvas 折线图 (双房间)
        // ============================================================
        var canvas = document.getElementById('cv');
        var ctx = canvas.getContext('2d');
        var RANGE = 'all';
        var animT = null;

        function palette() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return { c1: '#3b82f6', c2: '#34d399', a1: 'rgba(59,130,246,', a2: 'rgba(52,211,153,',
                         text: '#d1d5db', grid: '#2a2f3a', label: '#6b7280' };
            }
            return { c1: '#2563eb', c2: '#10b981', a1: 'rgba(37,99,235,', a2: 'rgba(16,185,129,',
                     text: '#1f2937', grid: '#f0f2f5', label: '#9ca3af' };
        }

        function buildSeries() {
            var a = [],
                b = [];
            for (var i = 0; i < RAW.length; i++) {
                var t = new Date(RAW[i][0]);
                var v1 = Number(RAW[i][3]);
                if (!isNaN(v1)) a.push({ t: t, v: v1 });
                if (RAW[i][6] !== undefined && RAW[i][6] !== null) {
                    var v2 = Number(RAW[i][6]);
                    if (!isNaN(v2)) b.push({ t: t, v: v2 });
                }
            }
            return [a, b];
        }

        function filterRange(pts) {
            if (!pts.length || RANGE === 'all') return pts;
            var end = pts[pts.length - 1].t.getTime();
            var start = end - parseInt(RANGE, 10) * 86400000;
            return pts.filter(function(p) { return p.t.getTime() >= start; });
        }

        function traceLine(px, py, n) {
            ctx.moveTo(px[0], py[0]);
            if (n === 1) return;
            if (n === 2) { ctx.lineTo(px[1], py[1]); return; }
            for (var i = 0; i < n - 1; i++) {
                var p0x = px[Math.max(i - 1, 0)],
                    p0y = py[Math.max(i - 1, 0)];
                var p1x = px[i],
                    p1y = py[i];
                var p2x = px[i + 1],
                    p2y = py[i + 1];
                var p3x = px[Math.min(i + 2, n - 1)],
                    p3y = py[Math.min(i + 2, n - 1)];
                ctx.bezierCurveTo(
                    p1x + (p2x - p0x) / 6, p1y + (p2y - p0y) / 6,
                    p2x - (p3x - p1x) / 6, p2y - (p3y - p1y) / 6,
                    p2x, p2y
                );
            }
        }

        function draw(pg) {
            var dpr = window.devicePixelRatio || 1;
            var w = canvas.clientWidth,
                h = canvas.clientHeight;
            if (!w || !h) { canvas.width = canvas.height = 0; return; }
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            var raw = buildSeries();
            var ptsA = filterRange(raw[0]);
            var ptsB = filterRange(raw[1]);
            if (!ptsA.length && !ptsB.length) {
                ctx.fillStyle = '#9ca3af';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('暂无数据', w / 2, h / 2);
                return;
            }
            var P = palette();
            var padL = 48,
                padR = 16,
                padT = 14,
                padB = 30;
            var pw = w - padL - padR,
                ph = h - padT - padB;

            var mn = Infinity,
                mx = -Infinity;
            var all = ptsA.concat(ptsB);
            for (var j = 0; j < all.length; j++) {
                if (all[j].v < mn) mn = all[j].v;
                if (all[j].v > mx) mx = all[j].v;
            }
            var lo = Math.floor((mn - 0.5) * 10) / 10;
            var hi = Math.ceil((mx + 0.5) * 10) / 10;
            if (hi - lo < 1) { hi = lo + 1; }

            var t0 = all[0].t.getTime(),
                t1 = all[all.length - 1].t.getTime();
            var span = (t1 - t0) || 1;

            function X(t) { return padL + (t.getTime() - t0) / span * pw; }

            function Y(v) { return padT + (hi - v) / (hi - lo) * ph; }

            function toXY(pts) {
                var px = [],
                    py = [];
                for (var k = 0; k < pts.length; k++) { px.push(X(pts[k].t)); py.push(Y(pts[k].v)); }
                return [px, py];
            }
            var XYa = toXY(ptsA),
                XYb = toXY(ptsB);

            // 网格 + Y轴
            ctx.font = '10px sans-serif';
            ctx.textBaseline = 'middle';
            var steps = 4;
            for (var s = 0; s <= steps; s++) {
                var vv = lo + (hi - lo) * s / steps;
                var yy = Y(vv);
                ctx.strokeStyle = P.grid;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(padL, yy);
                ctx.lineTo(padL + pw, yy);
                ctx.stroke();
                ctx.fillStyle = P.label;
                ctx.textAlign = 'right';
                ctx.fillText(vv.toFixed(1), padL - 6, yy);
            }
            // X轴时间
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = P.label;
            ctx.fillText(fmtDT(all[0].t), padL, padT + ph + 8);
            ctx.fillText(fmtDT(all[all.length - 1].t), padL + pw, padT + ph + 8);
            if (span > 36 * 3600000) {
                var mid = new Date((t0 + t1) / 2);
                ctx.fillText(
                    pad(mid.getMonth() + 1) + '-' + pad(mid.getDate()) + ' ' + pad(mid.getHours()) + ':00',
                    padL + pw / 2, padT + ph + 8
                );
            }

            var pDone = (pg === undefined || pg === null) ? 1 : pg;
            if (pDone < 1) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(padL, padT - 3, Math.max(1, pw * pDone) + 3, ph + 8);
                ctx.clip();
            }

            // 两条曲线: 面积 + 线 + 末点标签
            function paintSeries(px, py, lineColor, alphaPrefix, labelAbove) {
                if (!px.length) return;
                ctx.beginPath();
                ctx.moveTo(px[0], py[0]);
                traceLine(px, py, px.length);
                ctx.lineTo(px[px.length - 1], padT + ph);
                ctx.lineTo(px[0], padT + ph);
                ctx.closePath();
                var g = ctx.createLinearGradient(0, padT, 0, padT + ph);
                g.addColorStop(0, alphaPrefix + '0.20)');
                g.addColorStop(1, alphaPrefix + '0)');
                ctx.fillStyle = g;
                ctx.fill();

                ctx.beginPath();
                traceLine(px, py, px.length);
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 2.4;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.stroke();

                if (pDone >= 0.999) {
                    var lx = px[px.length - 1],
                        ly = py[py.length - 1];
                    ctx.beginPath();
                    ctx.arc(lx, ly, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 2.6;
                    ctx.strokeStyle = lineColor;
                    ctx.stroke();
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillStyle = lineColor;
                    var idx = (lineColor === P.c1) ? 3 : 6;
                    var lastRow = RAW[RAW.length - 1];
                    var lv = (lastRow && lastRow[idx] !== undefined && lastRow[idx] !== null) ? Number(lastRow[idx]) : null;
                    var label = (lv === null || isNaN(lv)) ? '' : lv.toFixed(1) + ' 度';
                    if (label) {
                        var tx = Math.min(lx + 10, padL + pw - 70);
                        if (labelAbove) {
                            ctx.textBaseline = 'bottom';
                            ctx.fillText(label, tx, ly - 7);
                        } else {
                            ctx.textBaseline = 'top';
                            ctx.fillText(label, tx, ly + 9);
                        }
                    }
                }
            }
            paintSeries(XYa[0], XYa[1], P.c1, P.a1, true);
            paintSeries(XYb[0], XYb[1], P.c2, P.a2, false);

            if (pDone < 1) ctx.restore();
        }

        // 动画
        function animate(pgFrom, ms) {
            if (animT) cancelAnimationFrame(animT);
            var t0 = performance.now(),
                len = Math.max(1, ms);

            function step(now) {
                var k = Math.min(1, (now - t0) / len);
                var e = 1 - Math.pow(1 - k, 3);
                draw(pgFrom + (1 - pgFrom) * e);
                if (k < 1) animT = requestAnimationFrame(step);
                else animT = null;
            }
            animT = requestAnimationFrame(step);
        }

        // ============================================================
        //  范围切换
        // ============================================================
        var btns = document.querySelectorAll('#ranges button');
        for (var b = 0; b < btns.length; b++) {
            btns[b].addEventListener('click', function() {
                RANGE = this.getAttribute('data-r');
                for (var q = 0; q < btns.length; q++) btns[q].className = '';
                this.className = 'on';
                animate(0, 400);
            });
        }

        // ============================================================
        //  数据刷新
        // ============================================================
        var useFetch = location.protocol !== 'file:';

        function refresh() {
            if (!useFetch) { location.reload(); return; }
            setStatus('loading');
            fetch('monitor_data.csv', { cache: 'no-store' })
                .then(function(r) {
                    if (!r.ok) throw new Error('http ' + r.status);
                    return r.text();
                })
                .then(function(txt) {
                    var rows = [];
                    var lines = txt.split(/\r?\n/);
                    for (var i = 0; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        var p = lines[i].split(',');
                        if (p.length >= 4 && p[0] !== 'time') {
                            function num(x) {
                                if (x === undefined || x === null) return null;
                                var s = String(x).trim();
                                if (s === '') return null;
                                var n = Number(s);
                                return isNaN(n) ? null : n;
                            }
                            var row = [p[0], num(p[1]), num(p[2]), num(p[3])];
                            if (p.length > 4) row.push(num(p[4]));
                            if (p.length > 5) row.push(num(p[5]));
                            if (p.length > 6) row.push(num(p[6]));
                            if (row[3] === null && (row[6] === undefined || row[6] === null)) continue;
                            rows.push(row);
                        }
                    }
                    if (rows.length && rows.length !== RAW.length) {
                        RAW = rows;
                        renderCard(true);
                        setStatus('updated');
                        animate(0, 680);
                        setTimeout(function() { setStatus('idle'); }, 3200);
                    } else if (rows.length) {
                        setStatus('idle');
                    } else {
                        setStatus('idle');
                    }
                })
                .catch(function() { location.reload(); });
        }
        if (useFetch) {
            setInterval(refresh, 5 * 60 * 1000);
            setTimeout(refresh, 2500);
        } else {
            setTimeout(function() { location.reload(); }, 5 * 60 * 1000);
        }

        // ============================================================
        //  启动
        // ============================================================
        renderCard();
        setStatus('idle');

        function redraw() {
            if (animT) { cancelAnimationFrame(animT);
                animT = null; }
            draw(1);
        }
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(redraw, 120);
        });
        window.addEventListener('orientationchange', function() { setTimeout(redraw, 350); });
        var darkMatch = window.matchMedia('(prefers-color-scheme: dark)');
        if (darkMatch.addEventListener) darkMatch.addEventListener('change', redraw);
        animate(0, 720);
    </script>
</body>
</html>
